name: ChatDesk WA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test and Build Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chatdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/chatdesk_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      JWT_SECRET: "test_jwt_secret_key_long_enough_123"
      JWT_REFRESH_SECRET: "test_jwt_refresh_secret_key_long_enough_123"
      META_WEBHOOK_VERIFY_TOKEN: "test_verify_token"
      META_APP_SECRET: "test_meta_app_secret_12345"
      PAYSTACK_SECRET_KEY: "sk_test_mock"
      PAYSTACK_WEBHOOK_SECRET: "sk_test_mock"
      AI_FAQ_ENABLED: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Tests with Coverage
        working-directory: ./backend
        run: npm test -- --coverage

      - name: Build Backend Bundle
        working-directory: ./backend
        run: npm run build
